cat > compose.yaml <<'EOF'
services:
  windows:
    image: dockurr/windows:latest
    container_name: w11
    environment:
      VERSION: "11"
      USERNAME: "Docker"
      PASSWORD: "${WINDOWS_PASSWORD}"
      RAM_SIZE: "4G"
      CPU_CORES: "2"
      DISK_SIZE: "64G"
      KVM: "N"
    devices:
      - /dev/kvm
    ports:
      - "8006:8006"
      - "3389:3389"
    volumes:
      - windows_data:/storage
    restart: unless-stopped
volumes:
  windows_data:
EOF
