services:
  windows:
    image: dockurr/windows:latest
    container_name: w11
    environment:
      VERSION: "${WINDOWS_VERSION:-11}"
      USERNAME: "${WINDOWS_USERNAME:-winuser}"
      PASSWORD: "${WINDOWS_PASSWORD:?Set WINDOWS_PASSWORD in .env}"
      RAM_SIZE: "${RAM_SIZE:-6G}"
      CPU_CORES: "${CPU_CORES:-4}"
      DISK_SIZE: "${DISK_SIZE:-64G}"
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "3389:3389/tcp"
    volumes:
      - windows-data:/storage
    restart: unless-stopped
    stop_grace_period: 2m

volumes:
  windows-data:
